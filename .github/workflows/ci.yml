name: Module 5 CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test transactions service
        run: |
          cd transactions
          npm install
          npm test
      - name: Validate Compose
        run: docker compose config -q
      - name: Build containers
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait
      - name: Check NGINX config
        run: docker compose exec -T nginx nginx -t
      - name: Check portfolio
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8081/
      - name: Check banking login
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 2 http://localhost:8081/api/login
      - name: Check invalid transactions ID
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/transactions/invalid-id)
          test "$status" = "400"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down -v
