services:
  mongo:
    image: mongo:7
    volumes: ["mongo_data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [app-network]
  backend:
    build: ./banking-backend
    expose: ["5000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/bank_app
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-local-dev-only-change-this}
    depends_on:
      mongo:
        condition: service_healthy
    networks: [app-network]
  transactions:
    build: ./transactions
    expose: ["3000"]
    environment:
      MONGO_URI: mongodb://mongo:27017/bank_app
    depends_on:
      mongo:
        condition: service_healthy
    networks: [app-network]
  studentportfolio:
    build: ./studentportfolio
    expose: ["80"]
    networks: [app-network]
  nginx:
    image: nginx:alpine
    ports: ["8081:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on: [backend, transactions, studentportfolio]
    networks: [app-network]
networks:
  app-network:
    driver: bridge
volumes:
  mongo_data:
