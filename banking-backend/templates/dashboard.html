<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Pixel River Financial Bank Application - Dashboard</title></head><body><h1>Pixel River Financial Bank Application</h1><h2>Welcome, {{ name }}</h2><p>Account balance: ${{ balance }}</p>{% for message in get_flashed_messages() %}<p>{{ message }}</p>{% endfor %}<h3>Deposit</h3><form method="post" action="{{ url_for('deposit') }}"><input name="amount" type="number" min="0.01" step="0.01" required><button>Deposit</button></form><h3>Withdraw</h3><form method="post" action="{{ url_for('withdraw') }}"><input name="amount" type="number" min="0.01" step="0.01" required><button>Withdraw</button></form><a href="{{ url_for('logout') }}">Logout</a></body></html>
